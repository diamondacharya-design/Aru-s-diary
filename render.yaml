services:
  - type: web
    name: arus-diary-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: aru-diary-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/aru-diary.sqlite
      - key: FRONTEND_ORIGIN
        sync: false
